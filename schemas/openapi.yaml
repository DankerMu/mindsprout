openapi: 3.1.0
info:
  title: "MindSprout API"
  version: "0.1.0"
paths:
  /api/healthz:
    get:
      summary: Liveness and dependency probe
      responses:
        "200":
          description: Process is up and dependencies are reachable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency probe failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/auth/session:
    get:
      summary: Read the current session
      responses:
        "200":
          description: The session identifies a user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSession"
        "401":
          description: The session is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unauthenticated
        "500":
          description: An unexpected internal failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: internal
components:
  schemas:
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required: [db]
          properties:
            db:
              type: string
              enum: [ok, fail, not-configured]
    PublicSession:
      type: object
      additionalProperties: false
      required: [username, isAdmin]
      properties:
        username:
          type: string
        isAdmin:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
