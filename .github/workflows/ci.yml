name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  layer1-fast-checks:
    name: Fast checks (fmt + lint + typecheck + boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries

  layer2-unit-tests:
    name: Unit + contract tests (per-file coverage gate)
    needs: layer1-fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: coverage-gate
        run: pnpm test:unit
      - run: pnpm test:contract

  layer3-integration-tests:
    name: Integration tests + API smoke
    needs: layer2-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app_test
      MIGRATION_DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      - name: Install hurl
        run: |
          curl -fsSL --retry 3 -o /tmp/hurl.deb \
            https://github.com/Orange-OpenSource/hurl/releases/download/7.0.0/hurl_7.0.0_amd64.deb
          sudo dpkg -i /tmp/hurl.deb
      - name: API smoke
        run: |
          pnpm dev:bg
          pnpm smoke
          pnpm dev:stop

  layer4-anti-drift:
    name: Anti-drift (duplicate + dead code + docs + decisions)
    needs: layer1-fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify constraints.yaml is the naming-guard regex source
        run: grep -q 'constraints\.yaml' .git-hooks/check-naming.sh
      - name: License audit contract tests
        run: pnpm test:licenses
      - name: Patched Stryker Vitest runner regression
        run: pnpm test:stryker-patch
      - name: Native override lockfile integrity
        run: pnpm test:native-lockfile
      - name: Installed dependency license audit
        run: pnpm licenses:check
      - name: Duplicate code
        run: pnpm duplicate-code
      - name: Dead code
        run: pnpm dead-code
      - name: Documentation gate
        run: pnpm docs:check
      - name: Decision-record gate
        run: pnpm decisions:check

  layer5-secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  layer7-e2e:
    name: E2E (Playwright)
    needs: layer2-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: .run/ui-evidence/e2e-results.json # Retain same-run evidence in always-upload artifacts, not mixed into stdout.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e
        run: |
          rm -f -- "$PLAYWRIGHT_JSON_OUTPUT_FILE"
          pnpm e2e --reporter=list,json
      - name: Assert zero skipped e2e tests
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          function requireField(condition, message) {
            if (!condition) throw new Error(message);
          }
          function object(value, label) {
            requireField(value !== null && typeof value === 'object' && !Array.isArray(value), `${label} must be an object`);
          }
          function array(value, label) {
            requireField(Array.isArray(value), `${label} must be an array`);
          }
          function string(value, label) {
            requireField(typeof value === 'string', `${label} must be a string`);
          }

          try {
            const report = JSON.parse(fs.readFileSync(process.env.PLAYWRIGHT_JSON_OUTPUT_FILE, 'utf8'));
            object(report, 'report');
            array(report.errors, 'report.errors');
            requireField(report.errors.length === 0, `report.errors must be empty: ${JSON.stringify(report.errors)}`);
            object(report.stats, 'report.stats');
            const counts = { expected: 0, unexpected: 0, flaky: 0, skipped: 0 };
            for (const status of Object.keys(counts)) {
              requireField(Number.isSafeInteger(report.stats[status]) && report.stats[status] >= 0, `report.stats.${status} must be a nonnegative integer`);
            }

            let routes = 0;
            const skipped = [];
            function visit(suites, label, parents = []) {
              array(suites, label);
              for (const [index, suite] of suites.entries()) {
                const at = `${label}[${index}]`;
                object(suite, at);
                string(suite.title, `${at}.title`);
                string(suite.file, `${at}.file`);
                array(suite.specs, `${at}.specs`);
                const titles = [...parents, suite.title];
                for (const [specIndex, spec] of suite.specs.entries()) {
                  const specAt = `${at}.specs[${specIndex}]`;
                  object(spec, specAt);
                  string(spec.title, `${specAt}.title`);
                  string(spec.file, `${specAt}.file`);
                  array(spec.tests, `${specAt}.tests`);
                  requireField(spec.tests.length > 0, `${specAt}.tests must not be empty`);
                  for (const [testIndex, test] of spec.tests.entries()) {
                    const testAt = `${specAt}.tests[${testIndex}]`;
                    object(test, testAt);
                    string(test.projectName, `${testAt}.projectName`);
                    requireField(typeof test.status === 'string' && Object.hasOwn(counts, test.status), `${testAt}.status must be a native test outcome`);
                    counts[test.status]++;
                    if (test.status === 'skipped') {
                      skipped.push({ file: spec.file, title: [...titles, spec.title].join(' > '), project: test.projectName });
                    }
                  }
                  if (spec.title.includes('renders without console errors')) routes++;
                }
                if (suite.suites !== undefined) visit(suite.suites, `${at}.suites`, titles);
              }
            }
            visit(report.suites, 'report.suites');
            for (const status of Object.keys(counts)) {
              requireField(counts[status] === report.stats[status], `report.stats.${status} mismatch: reported ${report.stats[status]}, found ${counts[status]} test outcomes`);
            }
            for (const test of skipped) console.error(`::error::Skipped E2E test: ${JSON.stringify(test)}`);
            requireField(skipped.length === 0, `${skipped.length} skipped E2E test(s)`);
            requireField(routes > 0, 'No route-smoke entry renders without console errors in the runtime report');
            console.log(`Zero skipped E2E tests; ${routes} route-smoke entry/entries in the runtime report`);
          } catch (error) {
            console.error(`::error::E2E runtime report rejected: ${error.message}`);
            process.exitCode = 1;
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-evidence
          path: .run/ui-evidence/
          if-no-files-found: ignore

  native-installed-runtime:
    name: Installed native HMR (${{ matrix.target }})
    needs: layer1-fast-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the installed native package
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p .run/native-installed
          {
            uname -a
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              sw_vers
            else
              cat /etc/os-release
              getconf GNU_LIBC_VERSION
            fi
            printf 'target=%s\n' "$NATIVE_TARGET"
            printf 'workflow_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > .run/native-installed/runtime.log
          pnpm native:installed | tee .run/native-installed/addon-load.log
      - name: Frozen installation integrity contract
        run: pnpm native:install:test .run/native-integrity
      - name: Install Chromium
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install chromium
          fi
      - run: pnpm native:browser:test
      - name: Installed restored-lifecycle counterexample
        run: pnpm native:browser restored-lifecycle .run/native-installed/restored
      - name: Installed source HMR and first SPA navigation
        run: pnpm native:browser source-change .run/native-installed/source
      - name: Production build with the installed addon
        run: pnpm build
      - name: Upload installed native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-installed-${{ github.sha }}-${{ matrix.target }}
          path: |
            .run/native-installed/*.log
            .run/native-installed/restored/*.json
            .run/native-installed/restored/*.jsonl
            .run/native-installed/restored/*.log
            .run/native-installed/restored/*.png
            .run/native-installed/restored/*.html
            .run/native-installed/source/*.json
            .run/native-installed/source/*.jsonl
            .run/native-installed/source/*.log
            .run/native-installed/source/*.png
            .run/native-installed/source/*.html
            .run/native-integrity/*.json
            .run/native-integrity/*.log
            .run/native-integrity/*.yaml
          if-no-files-found: error
          retention-days: 14

  layer8-sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep scan --config p/default --config p/typescript --error --metrics=off

  # Branch protection requires ONLY this check. GitHub treats a skipped required
  # check as PASSING, so `if: always()` is load-bearing: this job always runs and
  # fails on any failed, cancelled, or skipped required job.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - layer1-fast-checks
      - layer2-unit-tests
      - layer3-integration-tests
      - layer4-anti-drift
      - layer5-secret-scan
      - layer7-e2e
      - layer8-sast
      - native-installed-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail on any failed, cancelled, or skipped required job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "::error::A required job failed, was cancelled, or was skipped. Skipped counts as failure here because GitHub counts a skipped required check as passing."
            exit 1
          fi
