name: Weekly harness checks

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrail-self-test:
    name: Guardrail self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:guardrails

  agents-md-liveness:
    name: AGENTS.md command table vs package.json scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Diff documented pnpm commands against actual scripts
        run: |
          jq -r '.scripts | keys[]' package.json | sort -u > /tmp/targets.txt
          grep -oE 'pnpm [a-z][a-z0-9:-]*' AGENTS.md | awk '{print $2}' \
            | grep -vxE 'install|exec|dlx|add|remove|update|why|store' | sort -u > /tmp/documented.txt
          missing="$(comm -13 /tmp/targets.txt /tmp/documented.txt || true)"
          if [ -n "$missing" ]; then
            echo "::error::AGENTS.md documents pnpm scripts that do not exist in package.json:"
            echo "$missing"
            exit 1
          fi
          undocumented="$(comm -23 /tmp/targets.txt /tmp/documented.txt || true)"
          if [ -n "$undocumented" ]; then
            echo "::warning::package.json scripts not documented in AGENTS.md (add or intentionally omit):"
            echo "$undocumented"
          fi
