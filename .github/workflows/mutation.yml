name: Mutation testing

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  pull_request:
    paths:
      - stryker.config.mjs
      - vitest.config.ts
      - package.json
      - pnpm-lock.yaml
      - .tool-versions
      - .github/workflows/mutation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (stryker, advisory)
    runs-on: ubuntu-latest
    # Budget evidence: decisions/implemented/testing/0018-bounded-full-mutation-completion.md.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run and validate full mutation scope
        id: mutation-run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/mutation
          # Remove only this invocation's owned outputs; stale reports cannot qualify.
          rm -rf -- reports/mutation/events
          rm -f -- stryker.log reports/mutation/{index.html,mutation.json,identity.log,console.log,resources.jsonl,time.txt,stryker.log,telemetry-errors.log,stryker.config.mjs,tracked-source-test-files.txt,command.txt,sampler.log,event-timestamps.json,finalization.log,exit-status.json,exit-status.txt,accepted-completion.json}
          telemetry_pid=
          command_status=not-started
          capture_status=not-started
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            set +e
            fail_cleanup() {
              echo "::error::$1"
              if (( status == 0 )); then status=1; fi
            }
            if [[ -n "$telemetry_pid" ]]; then
              sampler_parent=$(ps -o ppid= -p "$telemetry_pid")
              if [[ "${sampler_parent//[[:space:]]/}" == "$$" ]]; then
                kill -TERM "$telemetry_pid" 2>/dev/null \
                  || fail_cleanup "Could not stop owned resource sampler"
              else
                fail_cleanup "Resource sampler exited before mutation finished"
              fi
              wait "$telemetry_pid"
              sampler_status=$?
              if (( sampler_status != 143 )); then
                fail_cleanup "Resource sampler wait failed: $sampler_status"
              fi
              printf 'stopped_at=%s\nwait_status=%s\nreaped=%s\n' \
                "$(date -u +%FT%TZ)" "$sampler_status" "$(( sampler_status != 127 ))" \
                >> reports/mutation/sampler.log \
                || fail_cleanup "Could not record sampler cleanup"
            else
              fail_cleanup "Resource sampler was not started"
            fi
            if [[ -f stryker.log ]]; then
              cp stryker.log reports/mutation/stryker.log \
                || fail_cleanup "Could not retain Stryker log"
            fi
            node --input-type=module - "$status" "$command_status" "$capture_status" <<'FINALIZE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          let status = Number(process.argv[2]);
          const directory = 'reports/mutation';
          const errors = [];
          let completion;
          function fail(error) {
            errors.push(error.message ?? String(error));
            if (status === 0) status = 1;
          }
          function requireFile(name) {
            const file = path.join(directory, name);
            if (!fs.existsSync(file) || !fs.statSync(file).isFile() || fs.statSync(file).size === 0) {
              throw new Error(`Missing or empty required artifact: ${name}`);
            }
            return file;
          }
          try {
            const eventsDirectory = path.join(directory, 'events');
            const events = fs.existsSync(eventsDirectory)
              ? fs.readdirSync(eventsDirectory).filter((name) => name.endsWith('.json')).sort()
              : [];
            const timestamps = events.map((name) => {
              const stat = fs.statSync(path.join(eventsDirectory, name), { bigint: true });
              return { path: `events/${name}`, bytes: String(stat.size), mtimeNs: String(stat.mtimeNs) };
            });
            fs.writeFileSync(path.join(directory, 'event-timestamps.json'), JSON.stringify(timestamps, null, 2));
          } catch (error) {
            fail(error);
          }
          for (const name of [
            'identity.log', 'console.log', 'resources.jsonl', 'time.txt', 'stryker.log',
            'stryker.config.mjs', 'tracked-source-test-files.txt', 'command.txt',
            'sampler.log', 'event-timestamps.json',
          ]) {
            try { requireFile(name); } catch (error) { fail(error); }
          }
          if (status === 0) {
            try {
              requireFile('index.html');
              const report = JSON.parse(fs.readFileSync(requireFile('mutation.json'), 'utf8'));
              const eventsDirectory = path.join(directory, 'events');
              const plans = fs.existsSync(eventsDirectory)
                ? fs.readdirSync(eventsDirectory).filter((name) => name.endsWith('-onMutationTestingPlanReady.json'))
                : [];
              if (plans.length !== 1) throw new Error(`Expected exactly one plan event; found ${plans.length}`);
              const plan = JSON.parse(fs.readFileSync(requireFile(`events/${plans[0]}`), 'utf8'));
              if (!Array.isArray(plan.mutantPlans) || plan.mutantPlans.length === 0) {
                throw new Error('Mutation plan must be nonempty');
              }
              function sourcePath(value) {
                if (typeof value !== 'string' || value.length === 0) throw new Error('Invalid source path');
                return path.resolve(value.replaceAll('\\', '/'));
              }
              function mutantId(mutant) {
                if (typeof mutant?.id !== 'string' || mutant.id.length === 0) throw new Error('Invalid mutant ID');
                return mutant.id;
              }
              const planned = new Map();
              for (const { mutant } of plan.mutantPlans) {
                const id = mutantId(mutant);
                if (planned.has(id)) throw new Error(`Duplicate planned ID: ${id}`);
                planned.set(id, sourcePath(mutant.fileName));
              }
              if (!report.files || typeof report.files !== 'object' || Array.isArray(report.files)) {
                throw new Error('Invalid report files');
              }
              const terminal = new Set(['Killed', 'Survived', 'Timeout', 'NoCoverage', 'RuntimeError', 'CompileError', 'Ignored']);
              const results = new Set();
              const statuses = {};
              for (const [fileName, file] of Object.entries(report.files)) {
                if (!Array.isArray(file.mutants)) throw new Error(`Invalid mutants for ${fileName}`);
                for (const mutant of file.mutants) {
                  const id = mutantId(mutant);
                  if (results.has(id)) throw new Error(`Duplicate result ID: ${id}`);
                  if (!planned.has(id)) throw new Error(`Unexpected result ID: ${id}`);
                  if (planned.get(id) !== sourcePath(fileName)) throw new Error(`Source path mismatch for ID: ${id}`);
                  if (!terminal.has(mutant.status)) throw new Error(`Nonterminal or unknown status for ID ${id}: ${mutant.status}`);
                  results.add(id);
                  statuses[mutant.status] = (statuses[mutant.status] ?? 0) + 1;
                }
              }
              const missing = [...planned.keys()].filter((id) => !results.has(id));
              if (missing.length) throw new Error(`Missing planned result IDs: ${missing.join(', ')}`);
              const { default: config } = await import(pathToFileURL(path.resolve('stryker.config.mjs')).href);
              for (const key of ['high', 'low']) {
                if (report.thresholds?.[key] !== config.thresholds[key]) {
                  throw new Error(`Report threshold mismatch: ${key}`);
                }
              }
              completion = { planned: planned.size, results: results.size, statuses, thresholds: report.thresholds };
            } catch (error) {
              fail(error);
            }
          }
          const metadata = {
            outcome: status === 0 ? 'complete' : 'diagnostics-only',
            exitStatus: status, commandStatus: process.argv[3], captureStatus: process.argv[4],
            finishedAt: new Date().toISOString(), errors,
          };
          try {
            fs.writeFileSync(path.join(directory, 'finalization.log'),
              `${errors.length ? errors.join('\n') : metadata.outcome}\n`);
            fs.writeFileSync(path.join(directory, 'exit-status.json'), JSON.stringify(metadata, null, 2));
            // Acceptance is last: cleanup, diagnostics, and exact plan coverage have all succeeded.
            if (status === 0) {
              fs.writeFileSync(path.join(directory, 'accepted-completion.json'), JSON.stringify({ ...metadata, ...completion }, null, 2));
            }
          } catch (error) {
            fail(error);
            metadata.outcome = 'diagnostics-only';
            metadata.exitStatus = status;
            fs.rmSync(path.join(directory, 'accepted-completion.json'), { force: true });
            fs.writeFileSync(path.join(directory, 'exit-status.json'), JSON.stringify(metadata, null, 2));
          }
          for (const error of errors) console.error(`::error::${error}`);
          if (status === 0) {
            console.log(`Accepted full mutation completion: ${completion.results} planned results`);
          } else {
            console.error(`Mutation artifacts are diagnostics only; exit ${status}`);
          }
          process.exitCode = status;
          FINALIZE
            finalizer_status=$?
            if (( status == 0 )); then status=$finalizer_status; fi
            if (( status != 0 )); then
              rm -f -- reports/mutation/accepted-completion.json
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          {
            date -u +%FT%TZ
            uname -a
            node --version
            pnpm --version
            pnpm exec stryker --version
            pnpm exec vitest --version
            pnpm exec tsc --version
            timeout --version
            /usr/bin/time --version
            getconf CLK_TCK
            getconf PAGESIZE
            lscpu
            free -b
            node --input-type=module -e 'import os from "node:os"; console.log(JSON.stringify({versions: process.versions, execPath: process.execPath, arch: process.arch, platform: process.platform, availableParallelism: os.availableParallelism(), totalMemoryBytes: os.totalmem(), cpus: os.cpus()}, null, 2))'
          } > reports/mutation/identity.log 2>&1
          cp stryker.config.mjs reports/mutation/stryker.config.mjs
          git ls-files src tests e2e > reports/mutation/tracked-source-test-files.txt
          node --input-type=module - <<'NODE' > reports/mutation/resources.jsonl 2> reports/mutation/telemetry-errors.log &
          import fs from 'node:fs';
          import path from 'node:path';
          function read(file) {
            try {
              return fs.readFileSync(file, 'utf8').trim();
            } catch (error) {
              if (['ENOENT', 'ESRCH', 'EACCES'].includes(error.code)) return null;
              throw error;
            }
          }
          const cgroupFiles = new Set();
          for (const line of (read('/proc/self/cgroup') ?? '').split('\n')) {
            const [id, controllers, ...parts] = line.split(':');
            const group = parts.join(':');
            const v2 = id === '0' && controllers === '';
            if (!v2 && !controllers?.split(',').includes('memory')) continue;
            const root = v2 ? '/sys/fs/cgroup' : '/sys/fs/cgroup/memory';
            const names = v2
              ? ['memory.current', 'memory.max', 'memory.peak', 'memory.events', 'cpu.max', 'cpu.stat']
              : ['memory.usage_in_bytes', 'memory.limit_in_bytes', 'memory.max_usage_in_bytes'];
            let directory = path.join(root, group);
            while (directory === root || directory.startsWith(`${root}/`)) {
              for (const name of names) cgroupFiles.add(path.join(directory, name));
              if (directory === root) break;
              directory = path.dirname(directory);
            }
          }
          function sample() {
            const processes = [];
            for (const pid of fs.readdirSync('/proc').filter((name) => /^\d+$/.test(name))) {
              const stat = read(`/proc/${pid}/stat`);
              if (!stat) continue;
              const end = stat.lastIndexOf(')');
              const fields = stat.slice(end + 2).split(/\s+/);
              processes.push({
                pid: Number(pid), name: stat.slice(stat.indexOf('(') + 1, end),
                state: fields[0], ppid: Number(fields[1]),
                userTicks: Number(fields[11]), systemTicks: Number(fields[12]),
                threads: Number(fields[17]), startTicks: Number(fields[19]),
                virtualBytes: Number(fields[20]), rssPages: Number(fields[21]),
              });
            }
            const cgroup = {};
            for (const file of cgroupFiles) {
              const value = read(file);
              if (value !== null) cgroup[file] = value;
            }
            console.log(JSON.stringify({
              timestamp: new Date().toISOString(), uptime: read('/proc/uptime'),
              cpu: read('/proc/stat'), memory: read('/proc/meminfo'),
              load: read('/proc/loadavg'), cgroup, processes,
            }));
          }
          sample();
          setInterval(sample, 5000);
          NODE
          telemetry_pid=$!
          printf 'pid=%s\nparent_pid=%s\nstarted_at=%s\n' "$telemetry_pid" "$$" \
            "$(date -u +%FT%TZ)" > reports/mutation/sampler.log
          # The outer time process survives timeout's TERM/KILL process-group cleanup.
          # Use info: debug logging serializes cyclic Vitest config and fails runner initialization.
          # 170m includes reserve over the measured 145m slow-host model (decision 0018).
          command=(timeout --signal=TERM --kill-after=30s 170m pnpm mutation
            --reporters clear-text,progress,html,event-recorder,json --fileLogLevel info)
          printf '%q ' /usr/bin/time -v -o reports/mutation/time.txt "${command[@]}" \
            > reports/mutation/command.txt
          printf '\nstarted_at=%s\n' "$(date -u +%FT%TZ)" >> reports/mutation/command.txt
          set +e
          /usr/bin/time -v -o reports/mutation/time.txt "${command[@]}" 2>&1 \
            | tee reports/mutation/console.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          # Preserve mutation/timeout failures (including 124), not tee's successful exit.
          command_status=${pipeline_status[0]}
          capture_status=${pipeline_status[1]}
          status=$command_status
          if (( status == 0 )); then status=$capture_status; fi
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: error
