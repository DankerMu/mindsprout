name: Installed native runtime
description: Qualify the installed native addon and both signed-in HMR scenarios.
inputs:
  target:
    description: Installed native package target
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .tool-versions
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm db:setup
      shell: bash
    - name: Verify the installed native package
      shell: bash
      env:
        NATIVE_TARGET: ${{ inputs.target }}
      run: |
        mkdir -p .run/native-installed
        {
          uname -a
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sw_vers
          else
            cat /etc/os-release
            getconf GNU_LIBC_VERSION
          fi
          printf 'target=%s\n' "$NATIVE_TARGET"
          printf 'workflow_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
        } > .run/native-installed/runtime.log
        pnpm native:installed | tee .run/native-installed/addon-load.log
    - name: Frozen installation integrity contract
      run: pnpm native:install:test .run/native-integrity
      shell: bash
    - name: Install Chromium
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          pnpm exec playwright install --with-deps chromium
        else
          pnpm exec playwright install chromium
        fi
    - run: pnpm native:browser:test
      shell: bash
    - name: Installed restored-lifecycle counterexample
      id: native_restored
      run: pnpm native:browser restored-lifecycle .run/native-installed/restored
      shell: bash
    - name: Installed source HMR and first SPA navigation
      id: native_source
      run: pnpm native:browser source-change .run/native-installed/source
      shell: bash
    - name: Diagnose a failed Darwin browser qualification
      id: native_diagnostic
      if: ${{ always() && !cancelled() && runner.os == 'macOS' && (steps.native_restored.outcome == 'failure' || steps.native_source.outcome == 'failure') }}
      shell: bash
      env:
        NATIVE_RESTORED_OUTCOME: ${{ steps.native_restored.outcome }}
        NATIVE_SOURCE_OUTCOME: ${{ steps.native_source.outcome }}
        NATIVE_PROFILE_CANCELLED: ${{ job.status == 'cancelled' }}
        NATIVE_PROFILE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        NATIVE_PROFILE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        mode="$(node scripts/native-hmr-profile.mjs --select-diagnostic)"
        if [[ -n "$mode" ]]; then
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          pnpm native:browser "$mode" .run/native-diagnostic --profile
        fi
    - name: Upload safe native diagnostic summary
      if: ${{ always() && steps.native_diagnostic.outputs.attempted == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: native-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.target }}
        path: .run/native-diagnostic/safe/summary.json
        if-no-files-found: error
        retention-days: 14
    - name: Production build with the installed addon
      run: pnpm build
      shell: bash
    - name: Upload installed native evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: native-installed-${{ github.sha }}-${{ inputs.target }}
        path: |
          .run/native-installed/*.log
          .run/native-installed/restored/*.json
          .run/native-installed/restored/*.jsonl
          .run/native-installed/restored/*.log
          .run/native-installed/restored/*.png
          .run/native-installed/restored/*.html
          .run/native-installed/source/*.json
          .run/native-installed/source/*.jsonl
          .run/native-installed/source/*.log
          .run/native-installed/source/*.png
          .run/native-installed/source/*.html
          .run/native-integrity/*.json
          .run/native-integrity/*.log
          .run/native-integrity/*.yaml
        if-no-files-found: error
        retention-days: 14
