# ── Code Canonicality ──────────────────────────────────────────

code_canonicality:
  forbidden_suffixes:
    description: "Filenames/identifiers matching these patterns are rejected at commit"
    patterns:
      - "(_v[0-9]+|_new|_old|_backup|_temp|_copy|_final|_real|_improved|_refactored|_fixed|_legacy|_deprecated|_archive|_save)$"
      - "(V[0-9]+|New|Old|Legacy|Deprecated|Backup)$"
    enforced_by: ".git-hooks/check-naming.sh"
  scratchpad_directories:
    description: "Directories that must never appear in commits"
    paths: ["tmp", "scratch", "backup", "_old", "deprecated", "archive", "wip"]
    # Literal repo-relative prefixes whose scratchpad segments are exempt; scratch below them is still rejected. Without this, OpenSpec's hard-coded archive dir blocks every `openspec archive` commit (decision 0007).
    exempt_prefixes: ["openspec/changes/archive/"]
    enforced_by: ".git-hooks/check-naming.sh + .gitignore"

# ── Size Limits ────────────────────────────────────────────────

size_limits:
  max_file_lines:
    value: 700
    severity: "block"
    enforced_by: "lint config (eslint max-lines)"
  max_complexity:
    value: 10
    severity: "block"
    enforced_by: "lint config (eslint complexity)"
  max_function_lines:
    value: 200
    severity: "review-only"
    enforced_by: "reviewer agent (no lint rule wired; complexity gate covers the usual cause)"
  max_pr_diff_lines:
    value: 400
    description: "PRs exceeding this require justification or splitting"
    severity: "block"
    enforced_by: "CI layer6-diff-size-guard (.github/workflows/pr-diff-guard.yml)"

# ── Test Discipline ────────────────────────────────────────────

testing:
  min_line_coverage:
    value: 90
    scope: "per-file"
    severity: "block"
    enforced_by: "CI coverage gate (vitest.config.ts coverage.thresholds)"
  tdd_mode:
    value: "required"
    description: "Every new production file under src/ ships with its paired test (scripts/check-test-pairing.sh)"
  forbid_mock_of_system_under_test:
    value: true
    description: "Mock dependencies, never the system under test"
  integration_tests:
    value: "real-db"
    description: "tests/integration runs against Postgres (docker compose locally, service container in CI); never self-skips"
  e2e_tests:
    value: "required"
    description: "Playwright walks every key UI path with zero console errors (e2e/smoke.spec.ts)"
  mutation_testing:
    value: "scheduled-weekly"
    severity: "warn"
    description: "stryker.config.mjs via .github/workflows/mutation.yml; weekly and mutation-config PRs; survivors reviewed, not blocking"

# ── Dependency Rules ───────────────────────────────────────────

dependencies:
  min_release_age_days:
    value: 3
    enforced_by: "renovate.json minimumReleaseAge"
  no_circular_dependencies:
    value: true
    enforced_by: "lint (dependency-cruiser no-circular)"
  new_dependency_requires_justification:
    value: true
    description: "PR description must explain why existing tools can't do the job"
  allowed_licenses:
    value: ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD"]
    enforced_by: "review-only (no CI license audit wired yet — readiness gap)"

# ── Anti-Drift ─────────────────────────────────────────────────

anti_drift:
  duplicate_code_threshold_percent:
    value: 2
    severity: "block"
    enforced_by: "jscpd (jscpd.json) via pnpm duplicate-code"
  dead_code_min_confidence:
    value: 80
    severity: "block"
    enforced_by: "knip (knip.json) via pnpm dead-code"

# ── Module Boundaries ──────────────────────────────────────────

module_boundaries:
  layers: ["domain", "application", "infrastructure", "presentation(src/app, src/components)"]
  allowed_dependency_directions:
    [
      "presentation -> application",
      "application -> domain",
      "infrastructure -> domain|application",
      "any -> src/shared",
      "domain -> zod (schema language, decision 0005)",
      "test files (*.test.ts, *.test.tsx) are exempt from domain-is-pure only: they may import the test runner and sibling fixtures; every other boundary rule applies to them (decision 0006)",
    ]
  forbidden_import_patterns:
    [
      "contexts/<a>/** -> contexts/<b>/** except via contexts/<a>/acl/",
      "domain|application -> next|react|react-dom|drizzle-orm|postgres|@supabase",
      "src/** -> src/app/**",
    ]
  enforced_by: "dependency-cruiser (.dependency-cruiser.cjs) via pnpm boundaries"

# ── Commit Discipline ──────────────────────────────────────────

commits:
  conventional_commits_required:
    value: true
    allowed_types: ["feat", "fix", "refactor", "chore", "docs", "test", "ci", "build", "perf"]
    enforced_by: "commitlint (commitlint.config.cjs) via .husky/commit-msg"
    agent_co_author_required: true

# ── CI Pipeline ────────────────────────────────────────────────

ci:
  risk_layers: 8
  fast_checks_timeout_minutes: 8
  matrix: ["ubuntu-latest / node 22.23.4"]
  required_status_checks:
    ["All checks passed", "Lockfile–manifest consistency", "PR diff size guard"]

# ── Runtime Verification ───────────────────────────────────────
# Machine-readable mirror of the AGENTS.md Verification Matrix — harnesses
# execute from here, humans read AGENTS.md. Keep the two in sync.

verification:
  health_url: "http://localhost:3000/api/healthz"
  dev_port: 3000
  key_api_routes:
    - path: "/api/healthz"
      status: "covered by smoke/health.hurl"
    - path: "/api/ai/generate"
      status: "pending — add to smoke/api.hurl when the route lands (M3)"
    - path: "/api/maps"
      status: "pending — add to smoke/api.hurl when the route lands (M2)"
    - path: "/api/ai/grow"
      status: "pending — add to smoke/api.hurl when the route lands (M4)"
  key_ui_paths:
    - path: "/"
      status: "covered by e2e/smoke.spec.ts"
    - path: "/maps/[id]"
      status: "covered by e2e/smoke.spec.ts"
  surfaces:
    liveness:
      command: "pnpm dev:status"
      evidence: "process-live+health-ok"
      required_at: "L2+"
    api:
      command: "pnpm smoke"
      evidence: "http-status+body"
      required_at: "L2+"
    ui:
      command: "pnpm e2e"
      evidence: "screenshot+console-clean"
      required_at: "L3+"
  enforced_by: "Stage 4 matrix-to-target check over constraints.yaml + AGENTS.md Verification Matrix + PR Runtime evidence section"

# ── Exemptions ──────────────────────────────────────────────────

exemptions:
  entries:
    - path: "src/app/**/{page,layout,loading,error,not-found,template,global-error}.tsx"
      rules: [min_line_coverage, tdd_mode]
      reason: "Next.js route components are verified by the Playwright tier (pnpm e2e), not unit coverage"
      expires: never
      exit_condition: "none — structural: the e2e tier owns rendered routes"
  enforced_by: "vitest.config.ts coverage.exclude, scripts/check-test-pairing.sh exempt_re, docs/.docgate.json allowlist"

# ── Violation Baseline ─────────────────────────────────────────
# Greenfield: no legacy violations exist. Keep mode none; never freeze a baseline retroactively.

baseline:
  mode: "none"
  rev: ""
  counts:
    duplicate_code: 0
    dead_code: 0
    size_violations: 0
    coverage_gap: 0
  enforced_by: "not applicable (greenfield)"

# ── Rehabilitation State ───────────────────────────────────────

rehabilitation:
  active: false
  phase: "none"
  baseline_frozen: false
  command_entrypoint: "pnpm check"
  runtime_verifier: "pnpm smoke"
  broad_refactor_allowed: true
  work_unit_protocol: "issue-tracker"
  readiness_gaps: []
  enforced_by: "AGENTS.md Verification Matrix"

# ── Refactor Contract ──────────────────────────────────────────

refactor_contract:
  active: false
  kind: "none"
  source_of_truth: []
  compare_depth: "none"
  cutover_policy: "none"
  forbidden_moves: []
  work_ownership: "none"
  human_gates: []
  enforced_by: "not applicable"

# ── Iteration Gates ────────────────────────────────────────────

iteration_gates:
  max_fix_cycles: 3
  checkpoint_commit_at_green: true
  test_weakening_forbidden: true
  one_task_one_branch: true
  enforced_by: "AGENTS.md Agent Operating Rules (review-only) + subagent-workflow fix_gate (.review-gate.json)"

# ── Environments ───────────────────────────────────────────────

environments:
  local: "full"
  staging: "deploy-via-ci, read-logs"
  prod: "none"
  enforced_by: "credential scoping + AGENTS.md Environment tiers"
